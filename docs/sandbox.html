<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindflex â€” Python Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;family=Syne:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --surface2: #181b22;
      --border: #1f2330;
      --accent: #00e5a0;
      --accent2: #4f8cff;
      --accent3: #ff5e7e;
      --text: #e8eaf2;
      --text-dim: #7a7f96;
      --text-dimmer: #3a3f56;
      --mono: 'Space Mono', monospace;
      --sans: 'Syne', sans-serif;
      /* highlight colors matching lesson snippets */
      --hl-kw:   #ff79c6;
      --hl-fn:   #50fa7b;
      --hl-str:  #f1fa8c;
      --hl-cm:   #6272a4;
      --hl-nm:   #4f8cff;
      --hl-num:  #bd93f9;
      --hl-op:   #ff79c6;
      --hl-cls:  #00e5a0;
      --hl-dec:  #ff79c6;
      --hl-self: #ff79c6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .9rem 2rem;
      background: rgba(10,12,16,.95);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 1rem;
    }
    .nav-left { display: flex; align-items: center; gap: 1.25rem; }
    .nav-logo {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }
    .nav-logo span { color: var(--text-dim); font-weight: 400; }
    .sandbox-badge {
      font-family: var(--mono);
      font-size: .62rem;
      padding: .2rem .6rem;
      border-radius: 99px;
      background: rgba(79,140,255,.1);
      color: var(--accent2);
      border: 1px solid rgba(79,140,255,.2);
    }
    .nav-right { display: flex; align-items: center; gap: .75rem; }
    .nav-link {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--text-dim);
      text-decoration: none;
      padding: .35rem .75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      transition: all .2s;
    }
    .nav-link:hover { color: var(--accent); border-color: rgba(0,229,160,.3); }

    /* TOOLBAR */
    .toolbar {
      position: relative;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 1rem;
    }
    .toolbar-left { display: flex; align-items: center; gap: 1rem; }
    .file-tabs { display: flex; align-items: center; gap: .3rem; }
    .file-tab {
      font-family: var(--mono);
      font-size: .7rem;
      padding: .3rem .85rem;
      border-radius: 4px 4px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      background: var(--surface2);
      color: var(--text-dimmer);
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .file-tab.active {
      background: #0d0f14;
      color: var(--text);
      border-color: var(--border);
    }
    .file-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 1px;
      background: #0d0f14;
    }
    .add-tab-btn {
      font-family: var(--mono);
      font-size: .8rem;
      padding: .2rem .5rem;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dimmer);
      cursor: pointer;
      transition: all .15s;
    }
    .add-tab-btn:hover { color: var(--accent); border-color: rgba(0,229,160,.3); }
    .toolbar-right { display: flex; align-items: center; gap: .6rem; }
    .snippet-select {
      font-family: var(--mono);
      font-size: .7rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: .3rem .6rem;
      border-radius: 4px;
      cursor: pointer;
      outline: none;
    }
    .snippet-select:hover { border-color: rgba(0,229,160,.3); }
    .clear-btn {
      font-family: var(--mono);
      font-size: .7rem;
      padding: .35rem .75rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dimmer);
      cursor: pointer;
      transition: all .15s;
    }
    .clear-btn:hover { color: var(--text-dim); }
    .run-btn {
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 700;
      padding: .4rem 1.2rem;
      border-radius: 5px;
      border: none;
      background: var(--accent);
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .45rem;
      box-shadow: 0 0 14px rgba(0,229,160,.2);
      transition: all .15s;
    }
    .run-btn:hover { box-shadow: 0 0 24px rgba(0,229,160,.4); transform: translateY(-1px); }
    .run-btn:active { transform: translateY(0); }
    .shortcut-hint {
      font-family: var(--mono);
      font-size: .58rem;
      color: var(--text-dimmer);
      white-space: nowrap;
    }

    /* MAIN SPLIT */
    .sandbox-body {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      flex: 1;
      overflow: hidden;
    }

    /* EDITOR PANE */
    .editor-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    #cmEditor {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* CodeMirror overrides */
    .cm-editor {
      flex: 1;
      height: 100%;
      font-family: var(--mono) !important;
      font-size: .82rem !important;
      background: #0d0f14 !important;
    }
    .cm-editor.cm-focused { outline: none !important; }
    .cm-scroller {
      overflow: auto !important;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      line-height: 1.9 !important;
    }
    .cm-content { padding: 1.1rem 0 !important; caret-color: var(--accent) !important; }
    .cm-line { padding: 0 1.25rem 0 0 !important; }

    /* Gutter / line numbers â€” each number vertically stacked, one per line */
    .cm-gutters {
      background: #0d0f14 !important;
      border-right: 1px solid var(--border) !important;
      color: var(--text-dimmer) !important;
      user-select: none !important;
      display: flex !important;
      flex-direction: row !important;
      min-width: 0 !important;
      padding-top: 0 !important;
    }
    .cm-lineNumbers {
      display: flex !important;
      flex-direction: column !important;
      min-width: 44px !important;
    }
    .cm-lineNumbers .cm-gutterElement {
      display: block !important;
      width: 100% !important;
      padding: 0 10px 0 8px !important;
      font-family: var(--mono) !important;
      font-size: .78rem !important;
      line-height: 1.9 !important;
      color: var(--text-dimmer) !important;
      text-align: right !important;
      white-space: nowrap !important;
    }
    .cm-activeLineGutter {
      background: rgba(0,229,160,.06) !important;
      color: var(--accent) !important;
    }
    .cm-activeLine { background: rgba(0,229,160,.04) !important; }
    .cm-selectionBackground { background: rgba(0,229,160,.18) !important; }
    .cm-cursor { border-left-color: var(--accent) !important; }

    /* â”€â”€ Syntax token colors matching lesson snippets â”€â”€ */
    /* keywords: if, for, def, class, return, import, etc. */
    .cm-keyword { color: var(--hl-kw) !important; }
    /* built-in functions: print, len, range, etc. */
    .cm-name.cm-variableName.cm-function { color: var(--hl-fn) !important; }
    .cm-builtin { color: var(--hl-fn) !important; }
    /* strings */
    .cm-string { color: var(--hl-str) !important; }
    .cm-string2 { color: var(--hl-str) !important; }
    /* comments */
    .cm-comment { color: var(--hl-cm) !important; font-style: italic; }
    /* numbers */
    .cm-number { color: var(--hl-num) !important; }
    /* operators */
    .cm-operator { color: var(--hl-op) !important; }
    /* function defs */
    .cm-def { color: var(--hl-fn) !important; }
    /* class names */
    .cm-typeName { color: var(--hl-cls) !important; }
    .cm-className { color: var(--hl-cls) !important; }
    /* punctuation */
    .cm-punctuation { color: var(--text-dim) !important; }
    /* variables / identifiers */
    .cm-variableName { color: var(--text) !important; }
    /* property access */
    .cm-propertyName { color: var(--hl-nm) !important; }
    /* decorators */
    .cm-meta { color: var(--hl-dec) !important; }
    /* self */
    .cm-self { color: var(--hl-self) !important; }
    /* bracket matching */
    .cm-matchingBracket {
      background: rgba(0,229,160,.15) !important;
      color: var(--accent) !important;
      border-radius: 2px;
    }
    .CodeMirror {
      flex: 1;
      height: 100%;
      background: #0d0f14;
      color: var(--text);
      font-family: var(--mono);
      font-size: .82rem;
      line-height: 1.9;
    }
    .CodeMirror-scroll { height: 100%; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .CodeMirror-gutters { background: #0d0f14; border-right: 1px solid var(--border); }
    .CodeMirror-linenumber { color: var(--text-dimmer); font-family: var(--mono); font-size: .78rem; padding: 0 10px 0 8px; }
    .CodeMirror-cursor { border-left-color: var(--accent); }
    .CodeMirror-selected { background: rgba(0,229,160,.18) !important; }
    .CodeMirror-activeline-background { background: rgba(0,229,160,.04); }
    .CodeMirror-matchingbracket { background: rgba(0,229,160,.15); color: var(--accent) !important; border-radius: 2px; }

    /* Autocomplete popup */
    .cm-tooltip { background: var(--surface2) !important; border: 1px solid var(--border) !important; border-radius: 6px !important; box-shadow: 0 8px 32px rgba(0,0,0,.5) !important; }
    .cm-tooltip.cm-tooltip-autocomplete > ul { font-family: var(--mono) !important; font-size: .78rem !important; max-height: 220px !important; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li { padding: .3rem .75rem !important; color: var(--text-dim) !important; display: flex !important; align-items: center !important; gap: .5rem !important; }
    .cm-tooltip.cm-tooltip-autocomplete > ul > li[aria-selected] { background: rgba(0,229,160,.12) !important; color: var(--text) !important; }
    .cm-completionLabel { font-family: var(--mono) !important; }
    .cm-completionDetail { color: var(--text-dimmer) !important; font-size: .7rem !important; margin-left: auto !important; }
    .cm-completionIcon { width: 14px !important; font-size: .7rem !important; }
    .cm-completionIcon-keyword::after { content: "kw"; color: var(--hl-kw) !important; font-size: .62rem !important; }
    .cm-completionIcon-function::after { content: "fn"; color: var(--hl-fn) !important; font-size: .62rem !important; }
    .cm-completionIcon-variable::after { content: "ab"; color: var(--hl-nm) !important; font-size: .62rem !important; }
    .cm-completionIcon-class::after { content: "cl"; color: var(--hl-cls) !important; font-size: .62rem !important; }
    .cm-completionIcon-text::after { content: "tx"; color: var(--text-dimmer) !important; font-size: .62rem !important; }

    /* RIGHT SIDE */
    .right-pane { display: flex; flex-direction: column; overflow: hidden; }
    .output-section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .output-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .55rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .output-header-label {
      font-family: var(--mono);
      font-size: .65rem;
      color: var(--text-dimmer);
      letter-spacing: .1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .output-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dimmer); }
    .output-dot.running { background: #ffbd2e; animation: pulse 1s infinite; }
    .output-dot.ok { background: var(--accent); }
    .output-dot.err { background: var(--accent3); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .output-clear-btn {
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--text-dimmer);
      background: none;
      border: none;
      cursor: pointer;
      transition: color .15s;
    }
    .output-clear-btn:hover { color: var(--text-dim); }
    .output-terminal {
      flex: 1;
      background: #070910;
      padding: .9rem 1rem;
      font-family: var(--mono);
      font-size: .78rem;
      line-height: 1.7;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .out-line { color: var(--text); display: block; }
    .err-line { color: var(--accent3); display: block; }
    .info-line { color: var(--text-dimmer); display: block; }
    .ok-line { color: var(--accent); display: block; }
    .prompt-line { color: var(--text-dimmer); display: block; margin-bottom: .25rem; }

    /* Cheatsheet */
    .cheatsheet {
      border-top: 1px solid var(--border);
      background: var(--surface);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      flex-shrink: 0;
      max-height: 260px;
    }
    .cheat-header {
      font-family: var(--mono);
      font-size: .62rem;
      color: var(--text-dimmer);
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: .6rem 1rem .4rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--surface);
    }
    .cheat-items { padding: .5rem .75rem .75rem; display: flex; flex-direction: column; gap: .25rem; }
    .cheat-item {
      display: flex;
      align-items: baseline;
      gap: .6rem;
      cursor: pointer;
      border-radius: 3px;
      padding: .2rem .3rem;
      transition: background .15s;
    }
    .cheat-item:hover { background: var(--surface2); }
    .cheat-code { font-family: var(--mono); font-size: .68rem; color: var(--hl-nm); white-space: nowrap; flex-shrink: 0; }
    .cheat-desc { font-size: .72rem; color: var(--text-dimmer); line-height: 1.3; }

    /* Pyodide loading overlay */
    .loading-overlay {
      position: fixed;
      bottom: 1rem; right: 1rem;
      z-index: 50;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .6rem 1rem;
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--text-dimmer);
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: opacity .3s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 800px) {
      .sandbox-body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .editor-pane { border-right: none; border-bottom: 1px solid var(--border); }
      nav { padding: .75rem 1rem; }
      .shortcut-hint { display: none; }
    }
  </style>
</head>

  <!-- CodeMirror 5 browser build. CodeMirror 6 is not published as a cdnjs global bundle. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script>
    function createMindflexEditor(parent, doc, onRun) {
      if (!window.CodeMirror) {
        throw new Error('CodeMirror failed to load. Check the CodeMirror CDN script URLs.');
      }

      const textarea = document.createElement('textarea');
      parent.appendChild(textarea);
      const cm = CodeMirror.fromTextArea(textarea, {
        mode: 'python',
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        lineWrapping: true,
        matchBrackets: true,
        extraKeys: {
          Tab(editor) {
            if (editor.somethingSelected()) editor.indentSelection('add');
            else editor.replaceSelection('    ', 'end');
          },
          'Ctrl-Enter': onRun,
          'Cmd-Enter': onRun,
        },
      });
      cm.setValue(doc);

      return {
        get state() {
          const value = cm.getValue();
          return {
            doc: { toString: () => value, length: value.length },
            selection: { main: { head: cm.indexFromPos(cm.getCursor()) } },
          };
        },
        dispatch(spec) {
          if (spec && spec.changes) {
            const from = spec.changes.from || 0;
            const to = spec.changes.to == null ? from : spec.changes.to;
            const insert = spec.changes.insert || '';
            cm.replaceRange(insert, cm.posFromIndex(from), cm.posFromIndex(to));
          }
          if (spec && spec.selection) cm.setCursor(cm.posFromIndex(spec.selection.anchor));
        },
        focus() { cm.focus(); },
        refresh() { cm.refresh(); },
      };
    }
    // Python autocomplete completions
    const pyBuiltins = [
      'print','len','range','type','int','float','str','bool','list','dict',
      'tuple','set','input','open','enumerate','zip','map','filter','sorted',
      'reversed','sum','min','max','abs','round','isinstance','issubclass',
      'hasattr','getattr','setattr','delattr','repr','id','hash','iter','next',
      'any','all','help','dir','vars','locals','globals','callable',
      'staticmethod','classmethod','property','super',
    ].map(label => ({ label, type: 'function', detail: 'builtin' }));

    const pyKeywords = [
      'and','as','assert','async','await','break','class','continue','def',
      'del','elif','else','except','finally','for','from','global','if',
      'import','in','is','lambda','nonlocal','not','or','pass','raise',
      'return','try','while','with','yield','True','False','None','self',
    ].map(label => ({ label, type: 'keyword' }));

    function pythonCompletions(context) {
      const word = context.matchBefore(/\w*/);
      if (!word || (word.from === word.to && !context.explicit)) return null;
      // also grab any identifiers already typed in the document
      const code = context.state.doc.toString();
      const identifiers = [...new Set(code.match(/\b[a-zA-Z_]\w*/g) || [])];
      const docWords = identifiers
        .filter(w => w !== word.text && !pyKeywords.find(k=>k.label===w) && !pyBuiltins.find(b=>b.label===w))
        .map(label => ({ label, type: 'variable' }));
      return {
        from: word.from,
        options: [...pyKeywords, ...pyBuiltins, ...docWords],
        validFor: /^\w*$/,
      };
    }

    // â”€â”€ Snippets â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const SNIPPETS = {
      lists: `# Module 4 Â· Lists in Python\n\n# Create a list of items\nfruits = ["apple", "banana", "cherry"]\n\n# Access elements by index (0-based)\nprint(fruits[0])   # â†’ "apple"\nprint(fruits[-1])  # â†’ "cherry"\n\n# List methods\nfruits.append("mango")\nfruits.remove("banana")\n\n# Iterate over a list\nfor fruit in fruits:\n    print(f"I like {fruit}")\n\n# List comprehension (Pythonic!)\nupper = [f.upper() for f in fruits]\nprint(upper)\n`,
      functions: `# Module 3 Â· Functions & Scope\n\n# Defining and calling a function\ndef greet(name, greeting="Hello"):\n    return f"{greeting}, {name}!"\n\nprint(greet("Alice"))\nprint(greet("Bob", "Hey"))\n\n# *args and **kwargs\ndef total(*nums):\n    return sum(nums)\n\nprint(total(1, 2, 3, 4))  # â†’ 10\n\n# Lambda expressions\nsquare = lambda x: x ** 2\nprint(square(7))  # â†’ 49\n\n# Higher-order functions\nnumbers = [3, 1, 4, 1, 5, 9, 2, 6]\nevens = list(filter(lambda n: n % 2 == 0, numbers))\nprint(evens)\n`,
      loops: `# Module 2 Â· Control Flow\n\nscore = 78\n\n# if / elif / else\nif score >= 90:\n    print("A")\nelif score >= 80:\n    print("B")\nelse:\n    print("C or below")\n\n# for loop with range\nfor i in range(1, 6):\n    print(i, i ** 2)\n\n# while with break\nn = 0\nwhile True:\n    n += 1\n    if n == 5: break\n\nprint(f"Stopped at n={n}")\n\n# List iteration\ncolors = ["red", "green", "blue"]\nfor i, color in enumerate(colors):\n    print(f"{i}: {color}")\n`,
      oop: `# Module 5 Â· Object-Oriented Python\n\nclass Animal:\n    def __init__(self, name, sound):\n        self.name = name\n        self.sound = sound\n\n    def speak(self):\n        return f"{self.name} says {self.sound}!"\n\n    def __repr__(self):\n        return f"Animal({self.name!r})"\n\nclass Dog(Animal):\n    def __init__(self, name):\n        super().__init__(name, "Woof")\n\n    def fetch(self):\n        return f"{self.name} fetches the ball!"\n\nrex = Dog("Rex")\nprint(rex.speak())\nprint(rex.fetch())\nprint(repr(rex))\nprint(isinstance(rex, Animal))  # True\n`,
      fileio: `# Module 6 Â· File I/O & Exceptions\n\n# Handling exceptions gracefully\ntry:\n    result = 10 / 0\nexcept ZeroDivisionError as e:\n    print(f"Caught: {e}")\nfinally:\n    print("Finally block always runs.")\n\n# Multiple exception types\ndef safe_int(s):\n    try:\n        return int(s)\n    except ValueError:\n        return None\n\nprint(safe_int("42"))      # â†’ 42\nprint(safe_int("hello"))   # â†’ None\n\n# Custom exception\nclass NegativeError(ValueError):\n    pass\n\ndef sqrt_safe(x):\n    if x < 0:\n        raise NegativeError(f"Cannot sqrt negative: {x}")\n    return x ** 0.5\n\ntry:\n    print(sqrt_safe(16))\n    print(sqrt_safe(-1))\nexcept NegativeError as e:\n    print(f"Error: {e}")\n`,
      hello: `# Hello, Python!\n\nname = "World"\nprint(f"Hello, {name}!")\n\n# Try some basics:\nfor i in range(1, 6):\n    print(f"  {i}: {'*' * i}")\n`,
      blank: `# Python Sandbox\n# Write your code here!\n\n`,
    };

    // â”€â”€ Tab manager â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let tabs = [{ id: 1, name: 'main.py', code: SNIPPETS.lists }];
    let activeTabId = 1;
    let nextTabId = 2;

    function renderTabs() {
      const container = document.getElementById('fileTabs');
      container.innerHTML = tabs.map(t => `
        <div class="file-tab${t.id === activeTabId ? ' active' : ''}" data-id="${t.id}">
          ${t.name}
          ${tabs.length > 1 ? `<span style="margin-left:.4rem;color:var(--text-dimmer);font-size:.65rem;" data-close="${t.id}">Ã—</span>` : ''}
        </div>
      `).join('');
      container.querySelectorAll('.file-tab').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target.dataset.close) closeTab(parseInt(e.target.dataset.close));
          else switchTab(parseInt(el.dataset.id));
        });
      });
    }

    function switchTab(id) {
      const cur = tabs.find(t => t.id === activeTabId);
      if (cur) cur.code = view.state.doc.toString();
      activeTabId = id;
      const tab = tabs.find(t => t.id === id);
      if (tab) view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: tab.code } });
      renderTabs();
    }

    function addTab() {
      const tab = { id: nextTabId++, name: `file${tabs.length + 1}.py`, code: '# New file\n' };
      tabs.push(tab);
      switchTab(tab.id);
    }

    function closeTab(id) {
      if (tabs.length <= 1) return;
      tabs = tabs.filter(t => t.id !== id);
      if (activeTabId === id) switchTab(tabs[0].id);
      else renderTabs();
    }

    // â”€â”€ Build CodeMirror editor â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const startDoc = SNIPPETS.lists;
    const view = createMindflexEditor(
      document.getElementById('cmEditor'),
      startDoc,
      () => { runCode(); return true; }
    );

    // â”€â”€ Helper: get code from editor â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function getCode() { return view.state.doc.toString(); }
    function setCode(code) {
      view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: code } });
    }

    // â”€â”€ Snippet loader â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    document.getElementById('snippetSelect').addEventListener('change', function() {
      const val = this.value;
      if (!val || !SNIPPETS[val]) { this.value = ''; return; }
      setCode(SNIPPETS[val]);
      this.value = '';
    });

    document.getElementById('clearBtn').addEventListener('click', () => setCode(''));
    document.getElementById('addTabBtn').addEventListener('click', addTab);
    document.getElementById('outputClearBtn').addEventListener('click', () => {
      document.getElementById('outputTerminal').innerHTML = '';
    });

    // â”€â”€ Pyodide â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let pyodide = null;
    let pyodideReady = false;

    async function loadPyodideRuntime() {
      try {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js';
        document.head.appendChild(script);
        await new Promise((res, rej) => { script.onload = res; script.onerror = rej; });
        pyodide = await window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.25.1/full/' });
        pyodideReady = true;
        document.getElementById('loadingOverlay').classList.add('hidden');
      } catch(e) {
        const el = document.getElementById('loadingOverlay');
        el.querySelector('.loading-spinner').style.display = 'none';
        el.childNodes[1].textContent = ' Python runtime unavailable â€” using basic mode';
        setTimeout(() => el.classList.add('hidden'), 3000);
      }
    }
    loadPyodideRuntime();

    function setDot(state) {
      const dot = document.getElementById('outputDot');
      dot.className = 'output-dot' + (state ? ' ' + state : '');
    }

    function appendOutput(text, cls) {
      const terminal = document.getElementById('outputTerminal');
      (text || '').split('\n').forEach((line, i, arr) => {
        if (i === arr.length - 1 && line === '') return;
        const span = document.createElement('span');
        span.className = cls;
        span.textContent = line;
        terminal.appendChild(span);
      });
      terminal.scrollTop = terminal.scrollHeight;
    }

    async function runCode() {
      const cur = tabs.find(t => t.id === activeTabId);
      if (cur) cur.code = getCode();
      const code = getCode();
      const terminal = document.getElementById('outputTerminal');
      terminal.innerHTML = '';
      setDot('running');
      appendOutput('$ python ' + (cur?.name || 'main.py'), 'prompt-line');

      if (pyodideReady && pyodide) {
        try {
          let stdout = '', stderr = '';
          pyodide.setStdout({ batched: s => { stdout += s + '\n'; } });
          pyodide.setStderr({ batched: s => { stderr += s + '\n'; } });
          await pyodide.runPythonAsync(code);
          if (stdout) appendOutput(stdout, 'out-line');
          if (stderr) appendOutput(stderr, 'err-line');
          if (!stdout && !stderr) appendOutput('(no output)', 'info-line');
          appendOutput('Process finished with exit code 0', 'ok-line');
          setDot('ok');
        } catch(e) {
          appendOutput(String(e), 'err-line');
          setDot('err');
        }
      } else {
        try {
          const lines = [];
          const fakePrint = (...args) => lines.push(args.map(a => {
            if (Array.isArray(a)) return '[' + a.map(x => typeof x === 'string' ? `'${x}'` : String(x)).join(', ') + ']';
            return String(a);
          }).join(' '));
          const fn = new Function('print', code.replace(/print\s*\(/g, 'print('));
          fn(fakePrint);
          lines.forEach(l => appendOutput(l, 'out-line'));
          if (!lines.length) appendOutput('(no output)', 'info-line');
          appendOutput('Process finished with exit code 0', 'ok-line');
          setDot('ok');
        } catch(e) {
          appendOutput(String(e), 'err-line');
          setDot('err');
        }
      }
    }

    document.getElementById('runBtn').addEventListener('click', runCode);

    // â”€â”€ Cheatsheet â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    const CHEAT = [
      { code: 'print(x)', desc: 'output x to console' },
      { code: 'type(x)', desc: 'get type of x' },
      { code: 'len(x)', desc: 'length of string/list' },
      { code: 'range(n)', desc: 'numbers 0 to n-1' },
      { code: 'int/float/str(x)', desc: 'type conversion' },
      { code: 'input("prompt")', desc: 'read user input (str)' },
      { code: 'f"{var}"', desc: 'f-string formatting' },
      { code: '[x for x in y]', desc: 'list comprehension' },
      { code: 'x if cond else y', desc: 'ternary expression' },
      { code: '.append(x)', desc: 'add item to list' },
      { code: '.split(sep)', desc: 'split string' },
      { code: '.join(lst)', desc: 'join list to string' },
      { code: 'sorted(x)', desc: 'return sorted list' },
      { code: 'enumerate(x)', desc: 'index+value pairs' },
      { code: 'zip(a,b)', desc: 'pair two iterables' },
      { code: 'dict.get(k,d)', desc: 'safe dict lookup' },
      { code: 'import module', desc: 'import a module' },
    ];

    const cheatEl = document.getElementById('cheatItems');
    cheatEl.innerHTML = CHEAT.map(c => `
      <div class="cheat-item" data-insert="${c.code}">
        <span class="cheat-code">${c.code}</span>
        <span class="cheat-desc">${c.desc}</span>
      </div>
    `).join('');

    cheatEl.querySelectorAll('.cheat-item').forEach(el => {
      el.addEventListener('click', () => {
        const insert = el.dataset.insert;
        const pos = view.state.selection.main.head;
        view.dispatch({
          changes: { from: pos, insert },
          selection: { anchor: pos + insert.length },
        });
        view.focus();
      });
    });

    // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    renderTabs();
  </script>
